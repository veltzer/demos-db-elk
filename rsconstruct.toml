# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[build]

[analyzer.markdown]

[analyzer.python]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["exercises"]

[processor.zspell]
src_dirs = ["exercises"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts", "config", "exercises"]

[processor.pylint]
src_dirs = ["scripts", "config", "exercises"]

[processor.mypy]
src_dirs = ["scripts", "config", "exercises"]
batch = false
# Serialize mypy. With batch = false rsconstruct runs one mypy process per
# file, and concurrent processes race on the sqlite metadata store in the
# shared .mypy_cache:
#   File "mypy/metastore.py", line 174, in connect_db
#     db.execute("PRAGMA journal_mode=WAL")
#   sqlite3.OperationalError: database is locked
# which mypy reports as a bare "INTERNAL ERROR". Reproduced at 4/4 runs with
# concurrency and 0/6 with this setting. Everything else still runs parallel.
max_jobs = 1

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "exercises", "config"]
args = ["--severity=error", "--shell=bash"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# Runtime deps + type stubs so CI installs what the exercises import
# (mypy/pylint resolve them; without these mypy reports missing stubs).

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
# actionlint 1.7.12's runner-label list predates the official ubuntu-26.04
# hosted runner; drop this ignore once a newer actionlint knows the label
args = ["-ignore", 'label "ubuntu-26\.04" is unknown']
