# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.markdown]

[analyzer.python]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_dirs = ["exercises"]
src_files = ["README.md"]

[processor.checker.zspell]
src_dirs = ["exercises"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.checker.ruff]
src_dirs = ["scripts", "exercises"]


[processor.checker.mypy]
src_dirs = ["scripts", "exercises"]
batch = false
# Serialize mypy. With batch = false rsconstruct runs one mypy process per
# file, and concurrent processes race on the sqlite metadata store in the
# shared .mypy_cache:
#   File "mypy/metastore.py", line 174, in connect_db
#     db.execute("PRAGMA journal_mode=WAL")
#   sqlite3.OperationalError: database is locked
# which mypy reports as a bare "INTERNAL ERROR". Reproduced at 4/4 runs with
# concurrency and 0/6 with this setting. Everything else still runs parallel.
max_jobs = 1

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.checker.shellcheck]
src_dirs = ["scripts", "exercises"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# Runtime deps + type stubs so CI installs what the exercises import
# (mypy/pylint resolve them; without these mypy reports missing stubs).

# lint the GitHub Actions workflow files with actionlint
[processor.checker.actionlint]
src_dirs = [".github/workflows"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_dirs = ["exercises"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.checker.ijsonlint]
src_dirs = ["exercises/developer/00_crud"]
